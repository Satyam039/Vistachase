name: Deploy VistaChase to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vistachase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Gate: the commit must build here before the server is touched.
      - name: Build Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          # Optional: the server's SSH host key fingerprint (SHA256). Unset, the host key isn't pinned.
          fingerprint: ${{ secrets.AWS_HOST_FINGERPRINT }}
          command_timeout: 20m
          script: |
            set -eu
            cd /home/ubuntu/Vistachase

            # Builds rewrite the committed sitemap/robots files; restore them so they never count
            # as local changes (otherwise every deploy after the first stops at the check below).
            git checkout -- frontend/public/robots.txt frontend/public/sitemap.xml frontend/public/sitemap-0.xml

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Tracked server changes found. Stopping safely."
              git status --short
              exit 1
            fi

            PREV=$(git rev-parse HEAD)
            git pull --ff-only origin main
            NEW=$(git rev-parse HEAD)
            echo "Deploying $PREV -> $NEW"

            # Build next to the running release; the live processes keep serving until the swap.
            cd backend
            if [ "$PREV" = "$NEW" ] || ! git diff --quiet "$PREV" "$NEW" -- package-lock.json; then npm ci; fi
            npx prisma generate
            npm run seed:departures || true
            rm -rf dist-prev
            if [ -d dist ]; then cp -a dist dist-prev; fi
            if ! npm run build; then
              if [ -d dist-prev ]; then rm -rf dist && mv dist-prev dist; fi
              echo "ERROR: backend build failed; previous build restored, nothing restarted."
              exit 1
            fi

            cd ../frontend
            if [ "$PREV" = "$NEW" ] || ! git diff --quiet "$PREV" "$NEW" -- package-lock.json; then npm ci; fi
            rm -rf .next-build
            # The live site keeps running from .next while this builds; frontend/.env.production.local
            # (for example NEXT_PUBLIC_MEDIA_CDN_URL) is read here. tsconfig.json already lists
            # .next-build/types, so this build leaves tracked files alone.
            if ! NEXT_BUILD_DIR=.next-build npx next build; then
              rm -rf .next-build
              echo "ERROR: frontend build failed; live build untouched, nothing restarted."
              exit 1
            fi
            rm -rf .next-prev
            if [ -d .next ]; then mv .next .next-prev; fi
            mv .next-build .next
            # The sitemap stays the committed one (regenerated by the build in CI).

            cd ..
            pm2 restart vistachase-backend
            pm2 restart vistachase-frontend

            healthy() {
              for i in $(seq 1 30); do
                if curl -fsS -m 10 http://127.0.0.1:4000/api/tours -o /dev/null \
                  && curl -fsS -m 10 http://127.0.0.1:3000/ -o /dev/null; then
                  return 0
                fi
                sleep 3
              done
              return 1
            }

            if healthy; then
              pm2 list
              echo "Deployment health checks passed ($NEW)."
            else
              echo "ERROR: health checks failed; rolling back to the previous build of $PREV."
              if [ -d backend/dist-prev ]; then (cd backend && rm -rf dist && cp -a dist-prev dist); fi
              if [ -d frontend/.next-prev ]; then (cd frontend && rm -rf .next && cp -a .next-prev .next); fi
              pm2 restart vistachase-backend
              pm2 restart vistachase-frontend
              healthy && echo "Rollback is serving." || echo "ERROR: rollback is not healthy either; check pm2 logs."
              pm2 list
              echo "Code is at $NEW but serving the $PREV build. Fix forward, or see the deployment notes."
              exit 1
            fi
