name: Vista Chase CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vistachase_secret
          POSTGRES_DB: vistachase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package.json'
        
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Configure Test Environment
      working-directory: ./backend
      run: |
        echo 'DATABASE_URL="postgresql://postgres:vistachase_secret@localhost:5432/vistachase_test?schema=public"' > .env
        echo 'REDIS_URL="redis://localhost:6379"' >> .env
        echo 'JWT_SECRET="super-secret-test-key-must-be-32-chars!"' >> .env
        echo 'NODE_ENV="test"' >> .env
        echo 'STRIPE_SECRET_KEY="sk_test_mock"' >> .env
        echo 'FEATURE_FALLBACK_CATALOG="true"' >> .env
        cp .env ../frontend/.env

    - name: Generate Prisma Client
      working-directory: ./backend
      run: npx prisma generate

    # Same command production runs at release; fails if the migrations don't match the schema.
    - name: Apply Prisma Migrations
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:vistachase_secret@localhost:5432/vistachase_test?schema=public
      run: |
        npx prisma migrate deploy
        # The migrated database must match schema.prisma exactly (catches a schema change without a migration).
        npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

    - name: Backend Typecheck
      working-directory: ./backend
      run: npm run typecheck

    - name: Backend Tests
      working-directory: ./backend
      env:
        # Tests reset and seed this database (tests/test-database-url.ts); never a real one.
        TEST_DATABASE_URL: postgresql://postgres:vistachase_secret@localhost:5432/vistachase_test?schema=public
        DATABASE_URL: postgresql://postgres:vistachase_secret@localhost:5432/vistachase_test?schema=public
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: super-secret-test-key-must-be-32-chars!
        NODE_ENV: test
      run: npm run test

    - name: Frontend Build Check
      working-directory: ./frontend
      env:
        FEATURE_FALLBACK_CATALOG: "true"
      run: npm run build
