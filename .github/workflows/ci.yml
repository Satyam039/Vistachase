```yaml
name: Deploy VistaChase to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vistachase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            cd /home/ubuntu/Vistachase

            git pull --ff-only origin main

            cd backend
            npm ci
            npx prisma generate
            npm run build

            cd ../frontend
            npm ci
            npm run build

            cd ..
            pm2 restart vistachase-backend
            pm2 restart vistachase-frontend

            sleep 5
            curl -fsS http://127.0.0.1:4000/api/tours -o /dev/null
            curl -fsS http://127.0.0.1:3000/ -o /dev/null

            echo "Deployment successful"
```
