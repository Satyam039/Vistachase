services:
  - type: web
    name: vistachase-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && node scripts/prepare-db.js && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vistachase-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CACHE_PROVIDER
        value: memory
      - key: STORAGE_PROVIDER
        value: local
      - key: EMAIL_PROVIDER
        value: console
      - key: PAYMENT_PROVIDER
        value: mock
      - key: AI_VOICE_PROVIDER
        value: mock
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: vistachase-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      # Public URL of vistachase-backend, e.g. https://vistachase-backend.onrender.com
      - key: BACKEND_URL
        sync: false

databases:
  - name: vistachase-db
    plan: free
    databaseName: vistachase
    user: vistachase_user
