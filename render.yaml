services:
  - type: web
    name: vistachase-web
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vistachase-db
          property: connectionString
      - key: CACHE_PROVIDER
        value: memory
      - key: STORAGE_PROVIDER
        value: local
      - key: EMAIL_PROVIDER
        value: console
      - key: PAYMENT_PROVIDER
        value: mock
      - key: AI_VOICE_PROVIDER
        value: mock
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: vistachase-db
    plan: free
    databaseName: vistachase
    user: vistachase_user
